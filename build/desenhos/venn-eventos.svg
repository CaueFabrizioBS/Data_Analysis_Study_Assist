<svg viewBox="0 0 520 185" width="490" xmlns="http://www.w3.org/2000/svg"><circle cx="70" cy="80" r="42" fill="#2b59c3" fill-opacity=".15" stroke="#2b59c3" stroke-width="2.5"/><circle cx="120" cy="80" r="42" fill="#e0453a" fill-opacity=".15" stroke="#e0453a" stroke-width="2.5"/><path d="M95 46 A42 42 0 0 1 95 114 A42 42 0 0 1 95 46 Z" fill="#8e44ad" fill-opacity=".45"/><text x="50" y="84" text-anchor="middle" font-size="18" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#2b59c3">A</text><text x="140" y="84" text-anchor="middle" font-size="18" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#e0453a">B</text><text x="95" y="150" text-anchor="middle" font-size="16" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#8e44ad">interseção A ∩ B</text><text x="95" y="172" text-anchor="middle" font-size="14" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">os dois acontecem</text><circle cx="230" cy="80" r="36" fill="#2b59c3" fill-opacity=".15" stroke="#2b59c3" stroke-width="2.5"/><circle cx="320" cy="80" r="36" fill="#e0453a" fill-opacity=".15" stroke="#e0453a" stroke-width="2.5"/><text x="230" y="86" text-anchor="middle" font-size="16" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#2b59c3">cara</text><text x="320" y="86" text-anchor="middle" font-size="16" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#e0453a">coroa</text><text x="275" y="150" text-anchor="middle" font-size="16" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#2f9e44">mutuamente exclusivos</text><text x="275" y="172" text-anchor="middle" font-size="14" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">P(A ∩ B) = 0</text><circle cx="410" cy="78" r="22" fill="#fffbea" stroke="#f2b705" stroke-width="2.5"/><rect x="448" y="58" width="40" height="40" rx="8" fill="#fff" stroke="#2b59c3" stroke-width="2.5"/><circle cx="460" cy="70" r="3" fill="#e0453a"/><circle cx="476" cy="86" r="3" fill="#e0453a"/><text x="410" y="84" text-anchor="middle" font-size="18" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#b98900">$</text><text x="445" y="150" text-anchor="middle" font-size="16" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#2b59c3">independentes</text><text x="445" y="172" text-anchor="middle" font-size="14" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">P(A ∩ B) = P(A) · P(B)</text><text x="260" y="22" text-anchor="start" font-size="13" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">moeda e dado: um não muda a chance do outro</text></svg>