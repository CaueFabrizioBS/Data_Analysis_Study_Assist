<svg viewBox="0 0 520 228" width="490" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="20" width="260" height="36" rx="6" fill="#fff" stroke="#2b59c3" stroke-width="2.5"/><text x="20" y="44" text-anchor="start" font-size="16" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#2b59c3">Receita</text><text x="262" y="44" text-anchor="end" font-size="15" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">1.000.000</text><text x="290" y="66" text-anchor="start" font-size="15" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#e0453a">− custo primário</text><path d="M276 56 q8 4 0 8" fill="none" stroke="#e0453a" stroke-width="2"/><rect x="40" y="64" width="230" height="36" rx="6" fill="#fff" stroke="#2f9e44" stroke-width="2.5"/><text x="50" y="88" text-anchor="start" font-size="16" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#2f9e44">Lucro bruto</text><text x="262" y="88" text-anchor="end" font-size="15" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">700.000</text><text x="290" y="110" text-anchor="start" font-size="15" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#e0453a">− custos operacionais</text><path d="M276 100 q8 4 0 8" fill="none" stroke="#e0453a" stroke-width="2"/><rect x="70" y="108" width="200" height="36" rx="6" fill="#fff" stroke="#b98900" stroke-width="2.5"/><text x="80" y="132" text-anchor="start" font-size="16" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#b98900">Lucro operacional</text><text x="262" y="132" text-anchor="end" font-size="15" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">500.000</text><text x="290" y="154" text-anchor="start" font-size="15" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#e0453a">− impostos e juros</text><path d="M276 144 q8 4 0 8" fill="none" stroke="#e0453a" stroke-width="2"/><rect x="100" y="152" width="170" height="36" rx="6