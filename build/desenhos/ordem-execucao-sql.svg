sive" fill="#1f2430">5</text><rect x="364" y="44" width="66" height="30" rx="7" fill="#eef4ff" stroke="#2b59c3" stroke-width="2.5"/><text x="397" y="64" text-anchor="middle" font-size="12" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#2b59c3">ORDER BY</text><text x="397" y="88" text-anchor="middle" font-size="14" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">6</text><rect x="434" y="24" width="66" height="30" rx="7" fill="#eef4ff" stroke="#2b59c3" stroke-width="2.5"/><text x="467" y="44" text-anchor="middle" font-size="13.5" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#2b59c3">LIMIT</text><text x="467" y="68" text-anchor="middle" font-size="14" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">7</text><text x="20" y="28" text-anchor="start" font-size="15" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">a gente escreve SELECT primeiro,</text><text x="20" y="48" text-anchor="start" font-size="15" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#1f2430">mas o banco executa nesta ordem</text><text x="330" y="196" text-anchor="middle" font-size="14" font-family="Letra do Caue, Ink Free, Segoe Print, cursive" fill="#e0453a">por isso o apelido do SELECT não vale no WHERE</text></svg>