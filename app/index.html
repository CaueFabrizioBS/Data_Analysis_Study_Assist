<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ofensiva de Dados</title>
<meta name="theme-color" content="#3a4fd6">
<meta name="description" content="Quiz diário de análise de dados com ofensiva, XP e repetição espaçada.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Ofensiva de Dados</div>
    <div class="stats">
      <div class="pill flame" title="Dias seguidos estudando"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3 4 5 4 9a4 4 0 0 1-8 0c0-1.3.4-2.3 1-3 .2 1.6 1 2.5 2 2.5 0-2.8-1-5.5 1-8.5zM6.5 13c0 3.6 2.5 7 5.5 7s5.5-3.4 5.5-7c1 1 1.5 2.3 1.5 3.8C19 20 15.9 22 12 22s-7-2-7-5.2c0-1.5.6-2.8 1.5-3.8z"/></svg><span id="streak">0</span></div>
      <div class="pill" title="XP total"><span id="xp">0</span>&nbsp;XP</div>
    </div>
  </header>
  <main id="app"></main>
  <div class="account" id="account"></div>
  <p class="account"><button class="gbtn" id="install" hidden>Instalar app no aparelho</button></p>
  <p class="account"><a class="link" href="guia.pdf" target="_blank" rel="noopener">Abrir o guia de estudos (PDF)</a></p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
