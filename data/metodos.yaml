# Dicionário de métodos. Ordenado automaticamente (A–Z) pelo campo nome no build.
# sig: a chamada com os parâmetros principais (não todos).
# uso: para que serve, em uma frase.
# busca (opcional): texto procurado nos capítulos para achar onde o método aparece.
#   Padrão: ".nome(" e "nome(". Os capítulos encontrados viram os links da direita.

# ---------------- Python puro
- nome: "append"
  lib: "lista"
  sig: "lista.append(item)"
  uso: "Põe um item no fim da lista. Muda a lista e devolve None."
- nome: "dict.get"
  lib: "dicionário"
  sig: "d.get(chave, padrao=None)"
  uso: "Lê a chave sem dar KeyError; se não existir, devolve o padrão."
  busca: ".get("
- nome: "dict.items"
  lib: "dicionário"
  sig: "d.items()"
  uso: "Pares (chave, valor) para percorrer os dois juntos num for."
  busca: ".items("
- nome: "dict.pop"
  lib: "dicionário"
  sig: "d.pop(chave, padrao)"
  uso: "Apaga a chave e devolve o valor dela."
  busca: ".pop("
- nome: "format"
  lib: "string"
  sig: "'{} tem {:.2f}'.format(a, b)"
  uso: "Encaixa valores no texto. Hoje a f-string faz o mesmo: f'{a} tem {b:.2f}'."
- nome: "join"
  lib: "string"
  sig: "'separador'.join(lista_de_textos)"
  uso: "Junta uma lista de textos numa string só, com o separador no meio."
- nome: "lower / upper"
  lib: "string"
  sig: "texto.lower()  ·  texto.upper()"
  uso: "Tudo minúsculo / maiúsculo. Devolve texto novo; o original não muda."
  busca: ".lower("
- nome: "open"
  lib: "Python"
  sig: "open(caminho, mode='r', encoding='utf-8')"
  uso: "Abre arquivo. 'r' lê, 'w' sobrescreve, 'a' acrescenta. Use com with."
  busca: "open("
- nome: "replace (string)"
  lib: "string"
  sig: "texto.replace(velho, novo, vezes)"
  uso: "Troca pedaços do texto. Devolve texto novo."
  busca: ".replace("
- nome: "sort / sorted"
  lib: "lista"
  sig: "lista.sort(key=None, reverse=False)  ·  sorted(lista, key, reverse)"
  uso: "sort muda a própria lista e devolve None; sorted devolve uma lista nova."
  busca: "sort("
- nome: "split"
  lib: "string"
  sig: "texto.split(sep=None, maxsplit=-1)"
  uso: "Quebra o texto numa lista. Sem sep, separa por espaços."
- nome: "strip"
  lib: "string"
  sig: "texto.strip(caracteres)"
  uso: "Tira espaços (ou os caracteres dados) do começo e do fim."

# ---------------- pandas: leitura e olhada
- nome: "read_csv"
  lib: "pandas"
  sig: "pd.read_csv(caminho, sep=',', header='infer', names, dtype, parse_dates)"
  uso: "Lê CSV para DataFrame. header=None quando o arquivo não tem cabeçalho."
- nome: "read_excel"
  lib: "pandas"
  sig: "pd.read_excel(caminho, sheet_name=0)"
  uso: "Lê planilha. sheet_name escolhe a aba (nome, número ou None para todas)."
- nome: "head / tail / sample"
  lib: "pandas"
  sig: "df.head(n=5)  ·  df.tail(n=5)  ·  df.sample(n, frac, random_state)"
  uso: "Primeiras, últimas ou linhas sorteadas. sample mostra melhor o meio dos dados."
  busca: ".head("
- nome: "info"
  lib: "pandas"
  sig: "df.info(memory_usage='deep')"
  uso: "Colunas, tipos, não nulos e memória. 'deep' mede o peso real do texto."
- nome: "describe"
  lib: "pandas"
  sig: "df.describe(include=None, percentiles)"
  uso: "Resumo estatístico: contagem, média, desvio, mínimo, quartis, máximo."
- nome: "value_counts"
  lib: "pandas"
  sig: "s.value_counts(normalize=False, dropna=True, sort=True)"
  uso: "Conta cada valor. normalize=True dá proporção; dropna=False conta os NaN."
- nome: "unique / nunique"
  lib: "pandas"
  sig: "s.unique()  ·  s.nunique(dropna=True)"
  uso: "Valores diferentes / quantos valores diferentes."
  busca: "nunique("

# ---------------- pandas: limpeza
- nome: "isna / notna"
  lib: "pandas"
  sig: "df.isna()  ·  df.notna()"
  uso: "True onde falta valor (ou onde tem). .isna().sum() conta os ausentes por coluna."
  busca: "isna("
- nome: "fillna"
  lib: "pandas"
  sig: "df.fillna(valor)  ·  df['col'] = df['col'].fillna(valor)"
  uso: "Preenche os NaN (valor fixo, média, mediana…)."
- nome: "dropna"
  lib: "pandas"
  sig: "df.dropna(subset=None, how='any', axis=0)"
  uso: "Remove linhas com NaN. subset olha só certas colunas; how='all' só se tudo faltar."
- nome: "duplicated / drop_duplicates"
  lib: "pandas"
  sig: "df.duplicated(subset, keep='first')  ·  df.drop_duplicates(subset, keep='first')"
  uso: "Marca / remove linhas repetidas. Depois: reset_index(drop=True)."
  busca: "duplicated("
- nome: "astype"
  lib: "pandas"
  sig: "s.astype('int' | 'float' | 'str' | 'category')"
  uso: "Muda o tipo da coluna. Dá erro se algum valor não converte."
- nome: "to_numeric"
  lib: "pandas"
  sig: "pd.to_numeric(s, errors='raise' | 'coerce')"
  uso: "Texto para número. errors='coerce' transforma o que não dá em NaN."
- nome: "to_datetime"
  lib: "pandas"
  sig: "pd.to_datetime(s, format='%d.%m.%Y %H:%M', errors)"
  uso: "Texto para data e hora. format diz como a data está escrita."
- nome: "rename"
  lib: "pandas"
  sig: "df.rename(columns={'velho': 'novo'})"
  uso: "Renomeia colunas (ou índice). Devolve DataFrame novo."
- nome: "replace (pandas)"
  lib: "pandas"
  sig: "s.replace(velho, novo)  ·  s.str.replace(padrao, novo, regex)"
  uso: "replace troca valores inteiros; .str.replace troca pedaços do texto (e pega 'SNES' ao trocar 'NES')."
  busca: ".str.replace("
- nome: "where"
  lib: "pandas"
  sig: "s.where(condicao, outro)"
  uso: "Mantém onde a condição é True e troca o resto por outro."
- nome: "reset_index"
  lib: "pandas"
  sig: "df.reset_index(drop=False)"
  uso: "Renumera o índice. drop=True joga fora o índice antigo em vez de virar coluna."
- nome: "drop"
  lib: "pandas"
  sig: "df.drop(columns=[...])  ·  df.drop(index=[...])"
  uso: "Remove colunas ou linhas pelo nome."

# ---------------- pandas: filtro e seleção
- nome: "loc / iloc"
  lib: "pandas"
  sig: "df.loc[linhas, colunas]  ·  df.iloc[posições, posições]"
  uso: "loc usa rótulos e inclui o fim; iloc usa posições e exclui o fim."
  busca: ".loc["
- nome: "query"
  lib: "pandas"
  sig: "df.query(\"col > 10 and outra in @lista\")"
  uso: "Filtra linhas escrevendo a condição como texto. @ chama variável Python."
- nome: "isin"
  lib: "pandas"
  sig: "s.isin(lista)"
  uso: "True onde o valor está na lista. Bom para filtrar várias categorias."
- nome: "sort_values"
  lib: "pandas"
  sig: "df.sort_values(by, ascending=True)"
  uso: "Ordena pelas colunas em by. Listas em by e ascending ordenam por várias."

# ---------------- pandas: agrupar e juntar
- nome: "groupby"
  lib: "pandas"
  sig: "df.groupby(by, as_index=True, dropna=True)['col'].agg(...)"
  uso: "Separa em grupos pelos valores de by e calcula algo em cada grupo. dropna=True ignora a chave NaN."
- nome: "agg"
  lib: "pandas"
  sig: ".agg({'col': 'sum', 'outra': ['mean', 'count']})"
  uso: "Várias contas de uma vez, depois de um groupby (ou no DataFrame inteiro)."
- nome: "pivot_table"
  lib: "pandas"
  sig: "df.pivot_table(index, columns, values, aggfunc='mean', fill_value)"
  uso: "Tabela em grade: index nas linhas, columns nas colunas, values agregados por aggfunc."
- nome: "merge"
  lib: "pandas"
  sig: "df1.merge(df2, on, how='inner', left_on, right_on, suffixes)"
  uso: "Junta tabelas por chave, como o JOIN do SQL. how: inner, left, right, outer."
- nome: "concat"
  lib: "pandas"
  sig: "pd.concat([df1, df2], axis=0, ignore_index=False)"
  uso: "Empilha tabelas (axis=0) ou põe lado a lado (axis=1)."
- nome: "apply"
  lib: "pandas"
  sig: "s.apply(funcao)  ·  df.apply(funcao, axis=1)"
  uso: "Roda uma função em cada valor; com axis=1, em cada linha (vê várias colunas)."
- nome: "map"
  lib: "pandas"
  sig: "s.map(dicionario | funcao)"
  uso: "Traduz cada valor da Series por um dicionário ou função. O que não acha vira NaN."
  busca: ".map("
- nome: "transform"
  lib: "pandas"
  sig: "df.groupby(by)['col'].transform('sum')"
  uso: "Conta por grupo, mas devolve um valor por LINHA (mesmo tamanho do df). Bom para coluna nova."
- nome: "cumsum"
  lib: "pandas"
  sig: "df.cumsum(axis=0)"
  uso: "Soma acumulada. axis=1 acumula ao longo da linha (ex.: LTV por idade da coorte)."
- nome: "pct_change"
  lib: "pandas"
  sig: "s.pct_change(periods=1)"
  uso: "Variação em relação ao valor anterior: valor ÷ anterior − 1. Na coorte, dá o cancelamento."

# ---------------- pandas: datas
- nome: "dt (acessor de datas)"
  lib: "pandas"
  sig: "s.dt.year  ·  s.dt.month  ·  s.dt.date  ·  s.dt.to_period('M')  ·  s.dt.isocalendar().week"
  uso: "Tira pedaços de uma coluna de data: ano, mês, dia, semana, mês como período."
  busca: ".dt."
- nome: "tz_localize / tz_convert"
  lib: "pandas"
  sig: "s.dt.tz_localize('UTC')  ·  s.dt.tz_convert('America/Sao_Paulo')"
  uso: "localize cola a etiqueta do fuso sem mudar a hora; convert muda a hora para outro fuso."
  busca: "tz_localize("

# ---------------- gráficos
- nome: "plot"
  lib: "pandas"
  sig: "df.plot(x, y, kind='line' | 'bar' | 'hist' | 'scatter', title, figsize, grid)"
  uso: "Gráfico direto do DataFrame. kind escolhe o tipo."
- nome: "hist"
  lib: "pandas"
  sig: "s.hist(bins=10, range=(min, max), density=False)"
  uso: "Histograma. density=True dá a densidade (área = frequência)."
- nome: "boxplot"
  lib: "pandas / seaborn"
  sig: "df.boxplot(column, by)  ·  sns.boxplot(data=df, x, y)"
  uso: "Diagrama de caixa: mediana, quartis e outliers."
- nome: "corr"
  lib: "pandas"
  sig: "df['a'].corr(df['b'])  ·  df.corr()"
  uso: "Correlação de Pearson (−1 a 1). Mede só relação linear."

# ---------------- estatística
- nome: "np.var / np.std"
  lib: "NumPy"
  sig: "np.var(x, ddof=0)  ·  np.std(x, ddof=0)"
  uso: "Variância e desvio dividindo por n. ddof=1 divide por n − 1, como o pandas."
  busca: "np.var("
- nome: "st.norm"
  lib: "SciPy"
  sig: "st.norm(media, desvio).cdf(x)  ·  .ppf(prob)"
  uso: "Distribuição normal. cdf: chance de ficar abaixo de x. ppf: o valor que deixa prob abaixo."
  busca: "st.norm("
- nome: "st.ttest_ind"
  lib: "SciPy"
  sig: "st.ttest_ind(amostra1, amostra2, equal_var=True)"
  uso: "Compara as médias de dois grupos independentes. equal_var=False se as variâncias diferem."
  busca: "ttest_ind("
- nome: "st.ttest_rel"
  lib: "SciPy"
  sig: "st.ttest_rel(antes, depois)"
  uso: "Compara médias do MESMO grupo em dois momentos (amostras pareadas)."
  busca: "ttest_rel("
- nome: "st.ttest_1samp"
  lib: "SciPy"
  sig: "st.ttest_1samp(amostra, valor)"
  uso: "Compara a média de uma amostra com um valor fixo."
  busca: "ttest_1samp"

# ---------------- web, JSON, regex
- nome: "requests.get / post"
  lib: "requests"
  sig: "requests.get(url, params, headers)  ·  requests.post(url, data, json)"
  uso: "get pede dados; post envia. Na resposta: .status_code, .text, .json()."
  busca: "requests.get("
- nome: "BeautifulSoup.find / find_all"
  lib: "bs4"
  sig: "soup.find('tag', attrs={'class': 'x'})  ·  soup.find_all('tag')"
  uso: "Acha a primeira tag / todas. tag.text dá o texto; tag['href'] dá o atributo."
  busca: "find_all("
- nome: "json.loads / json.dumps"
  lib: "json"
  sig: "json.loads(texto)  ·  json.dumps(objeto, ensure_ascii=False, indent=2)"
  uso: "loads: texto JSON para Python. dumps: Python para texto JSON. (load/dump: arquivo.)"
  busca: "json.loads("
- nome: "re.findall"
  lib: "re"
  sig: "re.findall(r'padrao', texto)"
  uso: "Lista com todos os pedaços do texto que batem com o padrão."
  busca: "findall("
- nome: "re.sub"
  lib: "re"
  sig: "re.sub(r'padrao', novo, texto)"
  uso: "Troca tudo que bate com o padrão."
  busca: "re.sub("

# ---------------- funções rápidas e arredondamento
- nome: "lambda"
  lib: "Python"
  sig: "lambda x: x * 100  ·  lambda x: 'boa' if x > 0.012 else 'fraca'"
  uso: "Função pequena e sem nome, montada na hora. Faz o que vem depois dos dois pontos. Costuma ir dentro de map ou apply."
  busca: "lambda "
- nome: "round"
  lib: "pandas / Python"
  sig: "s.round(4)  ·  round(numero, 4)"
  uso: "Arredonda e continua número. Diferente do .format, que transforma em texto."
